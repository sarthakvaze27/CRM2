<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Customer CRM{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><div class="bar">
  <a class="brand" href="{{ url_for('dashboard') }}">Customer CRM</a>
  <nav>
    <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint=='dashboard' }}">Dashboard</a>
    <a href="{{ url_for('customers_page') }}" class="{{ 'on' if request.endpoint in ('customers_page','customer_page') }}">Customers</a>
    <a href="{{ url_for('orders_page') }}" class="{{ 'on' if request.endpoint=='orders_page' }}">Orders</a>
    <a href="{{ url_for('logs_page') }}" class="{{ 'on' if request.endpoint=='logs_page' }}">Sync log</a>
  </nav>
  <form method="post" action="{{ url_for('sync') }}"><button>Sync from WooCommerce</button></form>
</div></header>
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}
  <div class="flash {{ cat }}">{{ msg }}</div>
{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
